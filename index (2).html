    h+='<div class="row">'+(m.ig?'<span class="badge">✔ Izin IG'+(m.igu?' · @'+esc(m.igu):'')+'</span>':'<span class="mut">Tanpa izin IG</span>')+(m.posted?'<span class="badge">Sudah diposting</span>':'')+'</div><div class="row" style="margin-top:8px">'
     +'<button class="sm" data-a="hide" data-id="'+m.id+'">'+(m.hidden?'Tampilkan':'Sembunyikan')+'</button>'
     +(m.ig?'<button class="sm" data-a="post" data-id="'+m.id+'">'+(m.posted?'Batal tandai':'Tandai diposting')+'</button><button class="sm" data-a="copy" data-id="'+m.id+'">Salin teks IG</button>':'')
     +'<button class="sm dng" data-a="del" data-id="'+m.id+'">Hapus</button></div>';
  }else{
    h+=rs.open===m.id?replyForm(m.id):'<div class="row"><button class="sm" data-a="open" data-id="'+m.id+'">💬 Balas'+(rl.length?' ('+rl.length+')':'')+'</button></div>';
  }
  return h+'</div>';
}

function renderWall(){
  var list=msgs.filter(function(m){return !m.hidden&&(fType==="semua"||m.type===fType)});
  var h='<div class="seg">'+["semua","kesan","menfess"].map(function(k){return '<button data-f="'+k+'" class="'+(fType===k?"on":"")+'">'+({semua:"Semua",kesan:"Kesan & Pesan",menfess:"Menfess"})[k]+'</button>'}).join("")+'</div>';
  if(flash)h+='<p class="ok">'+esc(flash)+'</p>';
  h+=list.length?list.map(function(m){return msgCard(m,false)}).join(""):'<div class="empty"><span>🌿</span>Belum ada cerita.<br>Jadilah yang pertama menulis!</div>';
  $("v-wall").innerHTML=h;
}

function renderSend(){
  var d=draft;
  $("v-send").innerHTML='<div class="card"><div class="seg"><button data-t="kesan" class="'+(d.type==="kesan"?"on":"")+'">Kesan & Pesan</button><button data-t="menfess" class="'+(d.type==="menfess"?"on":"")+'">Menfess</button></div>'
  +'<div class="lab">Nama</div><input type="text" id="f-name" maxlength="40" value="'+esc(d.name)+'" placeholder="Nama kamu">'
  +'<label class="chk"><input type="checkbox" id="f-anon" '+(d.anon?"checked":"")+'><span>Kirim sebagai <b>anonim</b> — namamu tidak ditampilkan</span></label>'
  +'<div class="lab" style="margin-top:12px">'+(d.type==="menfess"?"Isi menfess":"Kesan & pesanmu selama kegiatan")+'</div><textarea id="f-text" maxlength="1000" placeholder="Tulis di sini…">'+esc(d.text)+'</textarea>'+photoPick("f-img",d.img,"d")
  +'<label class="chk"><input type="checkbox" id="f-ig" '+(d.ig?"checked":"")+'><span>Izinkan ceritaku dibagikan ke <b>Instagram</b> Pelita Intan Muda Yogyakarta</span></label>'+(d.ig?'<div class="lab">Username Instagram (untuk di-tag)</div><input type="text" id="f-igu" maxlength="31" autocapitalize="none" autocorrect="off" value="'+esc(d.igu||"")+'" placeholder="@username">':'')
  +'<p class="mut">Semua pesan tampil di Dinding Cerita dan bisa dibalas peserta lain.</p>'
  +'<button class="pri" id="f-go" style="width:100%;padding:13px">Kirim 💚</button><p id="f-msg"></p></div>';
}

function renderAdmin(){
  if(!isAdmin){$("v-admin").innerHTML='<div class="card"><div class="lab">Login Admin</div><input type="text" id="lg-e" placeholder="Email" autocapitalize="none"><input type="password" id="lg-p" placeholder="Password"><button class="pri" data-a="login" style="width:100%">Masuk</button></div>';return}
  var ig=msgs.filter(function(m){return m.ig}).length,hd=msgs.filter(function(m){return m.hidden}).length;
  $("v-admin").innerHTML='<div class="stat"><div><b>'+msgs.length+'</b>Pesan</div><div><b>'+ig+'</b>Izin IG</div><div><b>'+reps.length+'</b>Balasan</div><div><b>'+hd+'</b>Disembunyikan</div></div>'
  +'<div class="row" style="margin:0 0 14px"><select id="a-f" style="width:auto;margin:0;flex:1"><option value="all">Semua</option><option value="ig">Izin IG saja</option><option value="igq">Izin IG, belum diposting</option><option value="hid">Disembunyikan</option><option value="anon">Anonim</option></select><button id="a-csv">⬇ CSV</button><button data-a="logout">Keluar</button></div><div id="a-list"></div>';
  var sel=$("a-f");sel.value=window._af||"all";
  sel.onchange=function(){window._af=sel.value;adminList()};
  $("a-csv").onclick=exportCsv;adminList();
}
function adminList(){
  var f=window._af||"all";
  var l=msgs.filter(function(m){return f==="all"||(f==="ig"&&m.ig)||(f==="igq"&&m.ig&&!m.posted)||(f==="hid"&&m.hidden)||(f==="anon"&&m.anon)});
  $("a-list").innerHTML=l.length?l.map(function(m){return msgCard(m,true)}).join(""):'<div class="empty">Tidak ada data.</div>';
}
var seen={},io=null;
function observe(){var els=document.querySelectorAll(".rv:not(.in)");if(!("IntersectionObserver" in window)){els.forEach(function(e){e.classList.add("in")});return}if(!io)io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){x.target.classList.add("in");if(x.target.dataset.cid)seen[x.target.dataset.cid]=1;io.unobserve(x.target)}})},{threshold:.1,rootMargin:"0px 0px -40px 0px"});els.forEach(function(e){io.observe(e)})}
function render(){
  var a=document.activeElement,fid=a&&a.id,ss=a&&a.selectionStart;
  $("cnt").textContent=msgs.filter(function(m){return !m.hidden}).length+" cerita sudah dibagikan";
  if(view==="wall")renderWall();else if(view==="send"){if(!$("v-send").innerHTML)renderSend()}else renderAdmin();
  if(fid&&(fid==="rt"||fid==="rn")&&$(fid)){$(fid).focus();try{$(fid).setSelectionRange(ss,ss)}catch(e){}}
  observe();
}

async function exportCsv(){
  var q=function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'};
  var rows=[["Waktu","Jenis","Nama","Anonim","Pesan","Izin IG","Diposting","Disembunyikan","Jumlah balasan","Ada foto","Username IG"]];
  msgs.forEach(function(m){rows.push([new Date(m.ts).toISOString(),m.type,m.name||"",m.anon?"ya":"tidak",m.text,m.ig?"ya":"tidak",m.posted?"ya":"tidak",m.hidden?"ya":"tidak",reps.filter(function(r){return r.mid===m.id}).length,m.img?"ya":"tidak",m.igu||""])});
  var csv="\ufeff"+rows.map(function(r){return r.map(q).join(",")}).join("\n");
  try{var bl=new Blob([csv],{type:"text/csv;charset=utf-8"}),lk=document.createElement("a");lk.href=URL.createObjectURL(bl);lk.download="kesan-pesan-gsi2.csv";document.body.appendChild(lk);lk.click();lk.remove()}catch(e){toast("Unduhan gagal.")}
}

document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="f-name")draft.name=t.value;
  if(t.id==="f-text")draft.text=t.value;
  if(t.id==="f-igu")draft.igu=t.value;
  if(t.id==="rn")rs.name=t.value;
  if(t.id==="rt")rs.text=t.value;
});
document.addEventListener("change",function(e){
  if(e.target.id==="f-anon")draft.anon=e.target.checked;
  if(e.target.id==="f-ig"){draft.ig=e.target.checked;renderSend()}
  var t=e.target;
  if((t.id==="f-img"||t.id==="r-img")&&t.files&&t.files[0]){
    shrink(t.files[0]).then(function(u){if(t.id==="f-img"){draft.img=u;renderSend()}else{rs.img=u;render()}}).catch(function(er){toast(er.message||"Foto gagal diproses")});
  }
});

document.addEventListener("click",async function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.f){var fo={semua:0,kesan:1,menfess:2},fd=fo[b.dataset.f]>=fo[fType]?"tabR":"tabL";fType=b.dataset.f;seen={};render();var ws=$("v-wall");ws.classList.remove("tabR","tabL");void ws.offsetWidth;ws.classList.add(fd);return}
  if(b.dataset.t){draft.type=b.dataset.t;renderSend();return}
  if(b.id==="f-go"){
    var m=$("f-msg"),txt=draft.text.trim();
    if(!txt){m.className="err";m.textContent="Pesan belum diisi.";return}
    if(!draft.anon&&!draft.name.trim()){m.className="err";m.textContent="Isi nama, atau centang anonim.";return}
    var igu=(draft.igu||"").trim().replace(/^@/,"");if(draft.ig&&!/^[A-Za-z0-9._]{1,30}$/.test(igu)){m.className="err";m.textContent="Isi username Instagram yang valid (tanpa spasi) agar bisa di-tag.";return}
    if(!db){m.className="err";m.textContent="Belum terhubung ke database. Muat ulang halaman.";return}
    b.disabled=true;
    try{
      var mid="m"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);await db.doc("msgs/"+mid).set({type:draft.type,anon:draft.anon,name:draft.anon?"":draft.name.trim(),text:txt,img:draft.img||"",ig:draft.ig,posted:false,hidden:false,ts:Date.now()});if(draft.ig||draft.anon){try{await db.doc("priv/"+mid).set({igu:draft.ig?igu:"",rn:draft.anon?draft.name.trim():""})}catch(x){}}
      draft={type:"kesan",anon:false,name:"",text:"",ig:false,img:""};$("v-send").innerHTML="";flash="Terima kasih! Ceritamu sudah terkirim 💚";show("wall");setTimeout(function(){flash="";if(view==="wall")render()},5000);
    }catch(err){b.disabled=false;m.className="err";m.textContent="Gagal mengirim: "+(err&&err.message||"coba lagi");}
    return;
  }
  var a=b.dataset.a,id=b.dataset.id;if(!a)return;
  if(a==="login"){var em=$("lg-e").value.trim(),pw=$("lg-p").value;b.disabled=true;var lr=await sb.auth.signInWithPassword({email:em,password:pw});b.disabled=false;if(lr.error){toast("Login gagal: "+lr.error.message);return}isAdmin=true;startPriv();render();toast("Login berhasil");return}
  if(a==="logout"){await sb.auth.signOut();isAdmin=false;priv={};privOn=false;show("wall");return}
  var mm=msgs.filter(function(x){return x.id===id})[0];
  if(a==="rmimg"){if(id==="d"){draft.img="";renderSend()}else{rs.img="";render()}return}
  if((a==="del"||a==="delrep")&&window._cf!==a+id){window._cf=a+id;b.textContent="Yakin? Ketuk lagi";setTimeout(function(){window._cf=null;if(view==="admin")render()},3000);return}
  window._cf=null;
  try{
    if(a==="open"){rs={open:id,name:"",text:"",err:"",busy:false};render();var t=$("rt");if(t)t.focus()}
    else if(a==="cancel"){rs={open:null,name:"",text:"",err:"",busy:false,img:""};render()}
    else if(a==="sendrep"){
      var tx=rs.text.trim();
      if(!tx){rs.err="Balasan belum diisi.";render();return}
      if(!db){rs.err="Belum terhubung ke database.";render();return}
      rs.busy=true;rs.err="";render();
      try{
        var rid="r"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
        await db.doc("replies/"+rid).set({mid:id,name:rs.name.trim(),anon:!rs.name.trim(),text:tx,img:rs.img||"",hidden:false,ts:Date.now()});
        rs={open:null,name:"",text:"",err:"",busy:false,img:""};
      }catch(err){rs.busy=false;rs.err="Gagal mengirim balasan ["+(err&&err.code||"error")+"]: "+(err&&err.message||String(err))}
      render();
    }
    else if(a==="hide")await db.doc("msgs/"+id).update({hidden:!mm.hidden});
    else if(a==="post")await db.doc("msgs/"+id).update({posted:!mm.posted});
    else if(a==="del"){{await Promise.all(repsOf(id,true).map(function(r){return db.doc("replies/"+r.id).delete()}));await db.doc("msgs/"+id).delete();try{await db.doc("priv/"+id).delete()}catch(x){}}}
    else if(a==="delrep"){await db.doc("replies/"+id).delete()}
    else if(a==="copy"){var s=(mm.type==="menfess"?"Menfess GSI #2":"Kesan & Pesan GSI #2")+"\n\n\""+mm.text+"\"\n— "+nm(mm)+(mm.igu?"\nTag: @"+mm.igu:"")+"\n\n#GreenSocialImpact #PelitaIntanMuda #Yogyakarta";await copyTxt(s,b)}
  }catch(err){toast("Gagal ["+(err&&err.code||"error")+"]: "+(err&&err.message||String(err)))}
});

function snap(s){return s.docs.map(function(d){var o=d.data();o.id=d.id;return o})}

(async function init(){
  var tk=false;function onS(){if(tk)return;tk=true;requestAnimationFrame(function(){tk=false;var y=window.scrollY||0,h=document.documentElement.scrollHeight-window.innerHeight,r=document.documentElement.style;r.setProperty("--sy",Math.min(y,600));r.setProperty("--p",h>0?Math.min(1,y/h):0)})}
  window.addEventListener("scroll",onS,{passive:true});onS();
  render();renderSend();
  try{
    var taps=0,tt;document.querySelector(".hero h1").addEventListener("click",function(){taps++;clearTimeout(tt);tt=setTimeout(function(){taps=0},1500);if(taps>=5){taps=0;show("admin")}});
    sb=supabase.createClient(SB_URL,SB_KEY);db=mkDb();var ss=await sb.auth.getSession();if(ss.data&&ss.data.session){isAdmin=true;startPriv()}
  }catch(e){}
  if(!db){$("notice").textContent="Koneksi ke database gagal. Pastikan SB_URL dan SB_KEY sudah diisi dengan benar.";return}
  var to=setTimeout(function(){$("notice").textContent="Koneksi lambat, mohon tunggu…"},10000);
  db.collection("msgs").orderBy("ts","desc").onSnapshot(function(s){clearTimeout(to);$("notice").textContent="";msgs=snap(s);merge();render()},function(){clearTimeout(to);$("notice").textContent="Gagal memuat pesan."});
  db.collection("replies").orderBy("ts","asc").onSnapshot(function(s){reps=snap(s);render()},function(){$("notice").textContent="Gagal memuat balasan."});
})();
})();
</script>
